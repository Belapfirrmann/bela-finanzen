name: Deploy auf GitHub Pages

# Läuft auf jedem Push, veröffentlicht aber nur vom Standard-Branch.
# So funktioniert es weiter, egal wie der Branch später heißt.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Setzt voraus, dass Pages einmalig auf die Quelle "GitHub Actions"
      # gestellt wurde: Settings -> Pages -> Build and deployment -> Source.
      # Automatisch freischalten darf der Workflow-Token nicht.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
